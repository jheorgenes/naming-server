# Porta normalmente utilizada para o Eureka
server:
  port: 8761
spring:
  application:
    name: naming-server
# Configuração para o Zipkin
management:
  tracing:
    sampling:
      probability: 1.0
zipkin:
  base-url: ${SPRING_ZIPKIN_BASEURL:http://localhost:9411}
# Como só tem um eureka rodando, abaixo eu desabilito que ele procure outros eurekas ou ele mesmo como uma instância ativa.
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false